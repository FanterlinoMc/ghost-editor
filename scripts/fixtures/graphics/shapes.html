<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shapes: grid to one</title>
<style>
  #sh { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  #sh canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="sh"><canvas id="cv" width="1080" height="1080"></canvas></div>
<script>
  window.duration = 4;
  window.size = { w: 1080, h: 1080 };
  window.rng = window.rng || function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function outCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function outExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
  function inOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function mix(a, b, p) { return a + (b - a) * p; }
  function $(id) { return document.getElementById(id); }
  // set a transform, or "none" at rest (a transform left at identity renders differently on a page that seeked there cold)
  function tf(el, x, y, s, r) {
    s = s === undefined ? 1 : s; r = r || 0;
    el.style.transform = (x === 0 && y === 0 && s === 1 && r === 0) ? "none" : "translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + r + "deg)";
  }
  var g = $("cv").getContext("2d");
  var CORAL = "#ff6b4a", CREAM = "#f3ede2", INK = "#16171c";
  var CELL = 250, ORG = 540 - CELL, S = 170;
  var items = [];
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    var k = r * 3 + c;
    items.push({ x: ORG + c * CELL, y: ORG + r * CELL, kind: k % 3, col: [CORAL, CREAM, INK][(r + c) % 3], d: Math.hypot(r - 1, c - 1), diag: r + c });
  }
  // a shape that morphs: 0 square (corner radius m), 1 circle, 2 triangle; drawn centred
  function shape(kind, size, round, rot, col) {
    g.save(); g.rotate(rot); g.fillStyle = col; g.beginPath();
    if (kind === 2) { var h = size * 0.9; g.moveTo(0, -h * 0.62); g.lineTo(h * 0.58, h * 0.42); g.lineTo(-h * 0.58, h * 0.42); g.closePath(); }
    else { var rr = kind === 1 ? size / 2 : mix(size * 0.12, size / 2, round); g.roundRect(-size / 2, -size / 2, size, size, rr); }
    g.fill(); g.restore();
  }
  window.seek = function (t) {
    g.clearRect(0, 0, 1080, 1080);
    var gather = inOut(seg(t, 2.35, 3.25));
    for (var i = 0; i < 9; i++) {
      var it = items[i];
      var a = 0.05 + 0.12 * it.d, p = outExpo(seg(t, a, a + 0.6));
      if (p <= 0) continue;
      // a diagonal wave: each shape turns a quarter, squares soften toward circles
      var w = inOut(seg(t, 1.0 + 0.1 * it.diag, 1.7 + 0.1 * it.diag));
      var rot = (it.kind === 2 ? Math.PI * 2 / 3 : Math.PI / 2) * w + (1 - p) * -0.5;
      var x = mix(it.x, 540, gather), y = mix(it.y, 540, gather);
      var size = S * p * mix(1, 0.5, gather);
      g.save(); g.translate(x, y); g.globalAlpha = 1 - outCubic(seg(t, 2.9, 3.25)) * (i === 4 ? 0 : 1);
      shape(it.kind, size, w, rot, it.col);
      g.restore();
    }
    // the nine become one: a coral disc with an ink square that turns to a diamond
    var one = outExpo(seg(t, 3.05, 3.7));
    if (one > 0) {
      g.save(); g.translate(540, 540);
      g.fillStyle = CORAL; g.beginPath(); g.arc(0, 0, 300 * one, 0, Math.PI * 2); g.fill();
      var sq = outExpo(seg(t, 3.2, 3.9));
      g.rotate(Math.PI / 4 * sq); g.fillStyle = INK; g.beginPath(); var z = 230 * sq; g.roundRect(-z / 2, -z / 2, z, z, 18 * sq); g.fill();
      g.rotate(-Math.PI / 4 * sq); g.fillStyle = CREAM; g.beginPath(); g.arc(0, 0, 44 * outExpo(seg(t, 3.35, 3.95)), 0, Math.PI * 2); g.fill();
      g.restore();
    }
  };
  window.seek(0);
</script>
</body>
</html>
