<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kinetic type: FOCUS</title>
<style>
  #kt { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: Unbounded, sans-serif; }
  #kt .slab { position: absolute; left: 90px; top: 380px; height: 300px; width: 0; background: #f2efe8; border-radius: 6px; }
  #kt .word { position: absolute; left: 90px; top: 380px; width: 900px; height: 300px; display: flex; justify-content: center; align-items: center; }
  #kt .m { position: relative; overflow: hidden; height: 180px; width: 140px; }
  #kt .m b { position: absolute; left: 0; width: 140px; top: 0; height: 180px; line-height: 180px; text-align: center; font-weight: 800; font-size: 150px; color: #101114; }
  #kt .tag { position: absolute; left: 90px; width: 900px; top: 712px; text-align: center; font-size: 40px; font-weight: 500; color: #f2efe8; letter-spacing: 0.02em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45); }
  #kt .tag i { font-style: normal; display: inline-block; }
  #kt .bar { position: absolute; left: 90px; top: 680px; height: 14px; width: 0; background: #ff4d2e; }
</style>
</head>
<body>
<div id="kt">
  <div class="slab" id="slab"></div>
  <div class="bar" id="bar"></div>
  <div class="word"><div class="m"><b id="c0">F</b></div><div class="m"><b id="c1">O</b></div><div class="m"><b id="c2">C</b></div><div class="m"><b id="c3">U</b></div><div class="m"><b id="c4">S</b></div></div>
  <div class="tag" id="tag"></div>
</div>
<script>
  window.duration = 3.5;
  window.size = { w: 1080, h: 1080 };
  window.rng = window.rng || function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function outCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function outExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
  function inOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function mix(a, b, p) { return a + (b - a) * p; }
  function $(id) { return document.getElementById(id); }
  // set a transform, or "none" at rest (a transform left at identity renders differently on a page that seeked there cold)
  function tf(el, x, y, s, r) {
    s = s === undefined ? 1 : s; r = r || 0;
    el.style.transform = (x === 0 && y === 0 && s === 1 && r === 0) ? "none" : "translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + r + "deg)";
  }
  var WORDS = ["one", "thing", "at", "a", "time."], tag = $("tag"), spans = [];
  for (var i = 0; i < WORDS.length; i++) { var s = document.createElement("i"); s.textContent = WORDS[i]; tag.appendChild(s); if (i < WORDS.length - 1) tag.appendChild(document.createTextNode(" ")); spans.push(s); }
  window.seek = function (t) {
    // the slab wipes open from the left, fast then precise
    var w = outExpo(seg(t, 0, 0.55));
    $("slab").style.width = Math.round(900 * w) + "px";
    // each letter slams down through its mask: a hard expo, 70 ms apart
    // (type stays under ~160 device px: measured, 168 px and larger glyphs differ by one level at a few pixels between renders)
    var hit = 0;
    for (var i = 0; i < 5; i++) {
      var a = 0.22 + 0.07 * i, p = outExpo(seg(t, a, a + 0.5)), el = $("c" + i);
      el.style.top = -Math.round(190 * (1 - p)) + "px";
      hit = Math.max(hit, Math.sin(Math.PI * seg(t, a + 0.06, a + 0.26)));
    }
    // each landing presses the slab down a few pixels, once, and it comes straight back
    $("slab").style.top = (380 + Math.round(6 * hit)) + "px";
    // the accent rule draws under the word, then the line of words rises word by word
    var b = inOut(seg(t, 0.85, 1.35));
    $("bar").style.width = Math.round(900 * b) + "px";
    for (i = 0; i < spans.length; i++) {
      var q = outExpo(seg(t, 1.2 + 0.09 * i, 1.8 + 0.09 * i));
      spans[i].style.opacity = q; tf(spans[i], 0, Math.round(26 * (1 - q)));
    }
    // the tagline's tracking opens slowly while the word holds
    var hold = seg(t, 1.0, 3.5);
    $("kt").style.letterSpacing = (0.06 * hold).toFixed(4) + "em";
  };
  window.seek(0);
</script>
</body>
</html>
