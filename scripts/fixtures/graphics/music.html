<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Music: Night Drive visualiser</title>
<style>
  #mu { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b12; }
  #mu canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: 0; font-family: Geist; font-weight: 700">Night Drive</div>
<div id="mu"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script>
  window.duration = 5;
  window.size = { w: 1080, h: 1920 };
  window.rng = window.rng || function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function outCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function outExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
  function inOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function mix(a, b, p) { return a + (b - a) * p; }
  function $(id) { return document.getElementById(id); }
  // set a transform, or "none" at rest (a transform left at identity renders differently on a page that seeked there cold)
  function tf(el, x, y, s, r) {
    s = s === undefined ? 1 : s; r = r || 0;
    el.style.transform = (x === 0 && y === 0 && s === 1 && r === 0) ? "none" : "translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + r + "deg)";
  }
  // the hidden line in the markup makes the page load the canvas font before frame 0 (canvas text never triggers the load itself in time)
  var g = $("cv").getContext("2d");
  var A = "#8b7cff", B = "#5ce1e6", TXT = "#f3f1fb";
  var NB = 72, NS = 48, r = window.rng(2024), band = [];
  // the synthetic signal: per band a base level, two partials and phases, drawn once at load
  for (var i = 0; i < NB; i++) band.push({ base: 0.18 + 0.2 * r(), f1: 0.6 + 1.8 * r(), f2: 2.5 + 3 * r(), p1: r() * 6.283, p2: r() * 6.283 });
  var BPM = 120, BEAT = 60 / BPM;
  function kick(t) { var x = ((t % BEAT) + BEAT) % BEAT; return Math.exp(-x * 9); }
  function hat(t) { var x = (((t + BEAT / 2) % BEAT) + BEAT) % BEAT; return Math.exp(-x * 22); }
  // level of band b (0 = lows) at time t, 0..1: lows ride the kick, highs the off-beat hat
  function level(b, t) {
    var q = band[b % NB], lo = 1 - b / (NB - 1);
    var v = q.base + 0.22 * (0.5 + 0.5 * Math.sin(2 * Math.PI * q.f1 * t + q.p1)) + 0.1 * Math.sin(2 * Math.PI * q.f2 * t + q.p2);
    v += 0.55 * kick(t) * lo * lo + 0.3 * hat(t) * (1 - lo) * (1 - lo);
    return clamp(v, 0, 1);
  }
  function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
  window.seek = function (t) {
    var bg = g.createLinearGradient(0, 0, 0, 1920); bg.addColorStop(0, "#0b0b12"); bg.addColorStop(1, "#161327");
    g.fillStyle = bg; g.fillRect(0, 0, 1080, 1920);
    var intro = outExpo(seg(t, 0, 0.9)), CX = 540, CY = 760, R0 = 230;
    // the ring: 72 bars, mirrored so the ring is symmetric, scaled in by the intro
    for (var i = 0; i < NB; i++) {
      var bi = i < NB / 2 ? i : NB - 1 - i;
      var lv = level(bi * 2, t) * intro, ang = -Math.PI / 2 + i * 2 * Math.PI / NB;
      var len = 18 + 190 * lv, c = Math.cos(ang), s = Math.sin(ang);
      g.strokeStyle = i % 2 ? A : B; g.globalAlpha = 0.55 + 0.45 * lv; g.lineWidth = 11; g.lineCap = "round";
      g.beginPath(); g.moveTo(CX + c * (R0 + 14), CY + s * (R0 + 14)); g.lineTo(CX + c * (R0 + 14 + len), CY + s * (R0 + 14 + len)); g.stroke();
    }
    g.globalAlpha = 1;
    // the disc: concentric grooves that turn slowly, pulsing on the kick
    var pulse = 1 + 0.035 * kick(t) * intro, rot = t * 0.9;
    g.save(); g.translate(CX, CY); g.scale(pulse * intro, pulse * intro);
    var dg = g.createLinearGradient(-R0, -R0, R0, R0); dg.addColorStop(0, A); dg.addColorStop(1, B);
    g.fillStyle = dg; g.beginPath(); g.arc(0, 0, R0, 0, 6.2832); g.fill();
    g.rotate(rot); g.strokeStyle = "rgba(11, 11, 18, 0.35)"; g.lineWidth = 3;
    for (var k = 0; k < 7; k++) { g.beginPath(); g.arc(0, 0, 70 + k * 22, 0.3 + k * 0.4, 0.3 + k * 0.4 + 4.2); g.stroke(); }
    g.fillStyle = "#0b0b12"; g.beginPath(); g.arc(0, 0, 46, 0, 6.2832); g.fill();
    g.fillStyle = TXT; g.beginPath(); g.arc(0, 0, 10, 0, 6.2832); g.fill();
    g.restore();
    // title block
    var a = outExpo(seg(t, 0.35, 1.05)), b = outExpo(seg(t, 0.45, 1.15));
    g.textAlign = "left";
    g.globalAlpha = a; g.fillStyle = TXT; g.font = "700 76px Geist"; g.fillText("Night Drive", 110, 1230 + 30 * (1 - a));
    g.globalAlpha = b * 0.6; g.font = "400 38px Geist"; g.fillText("Studio Session · Side A", 110, 1290 + 30 * (1 - b));
    // the spectrum strip: 48 bars from the same signal
    var sp = outExpo(seg(t, 0.55, 1.3));
    for (i = 0; i < NS; i++) {
      var h = (10 + 150 * level(Math.round(i * (NB - 1) / (NS - 1)), t)) * sp, x = 110 + i * 18;
      g.globalAlpha = 0.35 + 0.65 * sp; g.fillStyle = i < NS * 0.3 ? A : (i < NS * 0.62 ? "#a8a3d8" : B);
      g.beginPath(); g.roundRect(x, 1540 - h, 10, h, 5); g.fill();
    }
    // progress and time, both from t
    var pos = 42 + t, total = 198, pr = pos / total;
    g.globalAlpha = sp; g.fillStyle = "rgba(243, 241, 251, 0.16)"; g.beginPath(); g.roundRect(110, 1600, 860, 8, 4); g.fill();
    g.fillStyle = TXT; g.beginPath(); g.roundRect(110, 1600, 860 * pr, 8, 4); g.fill();
    g.beginPath(); g.arc(110 + 860 * pr, 1604, 13, 0, 6.2832); g.fill();
    g.globalAlpha = sp * 0.6; g.font = "500 32px Geist"; g.fillText(fmt(pos), 110, 1664);
    g.textAlign = "right"; g.fillText(fmt(total), 970, 1664); g.globalAlpha = 1;
  };
  window.seek(0);
</script>
</body>
</html>
