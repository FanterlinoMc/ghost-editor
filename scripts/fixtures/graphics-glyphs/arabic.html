<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glyph check: arabic</title>
<style>
  #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; background: #101114; }
  .bubble { position: absolute; right: 120px; padding: 28px 40px; border-radius: 40px; background: #2b6cf6; color: #fff; font-size: 64px; font-weight: 600; direction: rtl; }
  #cv { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="root">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: 0; font-family: Inter; font-weight: 600">Aa مرحبا بالعالم</div>
<div class="bubble" id="b1" style="top: 220px">مرحبا بالعالم</div>
<div class="bubble" id="b2" style="top: 420px">شكراً، أراك غداً</div>
<canvas id="cv" width="1080" height="1080"></canvas>
</div>
<script>
  window.duration = 2;
  window.size = { w: 1080, h: 1080 };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  var g = document.getElementById("cv").getContext("2d");
  window.seek = function (t) {
    document.getElementById("b2").style.opacity = clamp(t * 2, 0, 1);
    g.clearRect(0, 0, 1080, 1080);
    g.fillStyle = "#fff";
    g.font = "600 72px Inter";
    g.direction = "rtl";
    g.textAlign = "right";
    g.fillText("مرحبا " + Math.round(t * 10), 960, 800);
  };
</script>
</body>
</html>
